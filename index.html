<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZuriNews Live</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="news-feed" id="reporterFrame">
    <div class="ambient-glow" aria-hidden="true"></div>

    <section class="hero-story">
      <div class="reporter-overlay">
        <img src="Zuri.png" alt="Zuri AI broadcaster" class="zuri-avatar" />
        <div class="live-badge">LIVE · ZURI</div>
      </div>

      <div class="story-content">
        <p class="kicker" id="status">Booting newsroom…</p>
        <h1 id="currentStory">Loading top story…</h1>
        <p id="summary" class="summary">Synthesizing summary…</p>
      </div>
    </section>

    <section class="feed-section">
      <h2>Live Feed</h2>
      <ul id="feedList" class="feed-list"></ul>
    </section>

    <section class="audio-controls">
      <button id="toggleVoice" class="voice-btn">Voice: On</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
